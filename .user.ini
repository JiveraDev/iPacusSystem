; Never render PHP diagnostics into HTTP responses. Application errors are
; written to the configured PHP error log and returned to clients as safe JSON.
display_errors = Off
display_startup_errors = Off
log_errors = On
html_errors = Off

; Grooming accepts image files up to 8 MiB. The POST body needs additional
; room for multipart form fields and headers.
file_uploads = On
upload_max_filesize = 8M
post_max_size = 10M
