<title id="ipawcus-context-title">IPAWCUS Context Diagram</title>
<desc>FigJam-importable IPAWCUS data-flow diagram with editable vector shapes and text.</desc>
<defs><marker id="ipawcus-context-arrow" markerWidth="10" markerHeight="10" refX="8.5" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/></marker></defs>
<g id="ipawcus-context-board">
<rect x="0" y="0" width="2200" height="1600" fill="#ffffff"/><text x="30" y="38" text-anchor="start" dominant-baseline="middle" font-family="Inter, Arial, sans-serif" font-size="25" font-weight="750" fill="#0f172a"><tspan x="30" y="38.0">IPAWCUS Context Diagram</tspan></text><text x="30" y="68" text-anchor="start" dominant-baseline="middle" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#475569"><tspan x="30" y="68.0">Process 0 and the four external user roles — centered snowflake layout</tspan></text><rect x="1520" y="18" width="650" height="42" rx="7" fill="#f8fafc" stroke="#cbd5e1"/><text x="1845" y="39" text-anchor="middle" dominant-baseline="middle" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="700" fill="#334155"><tspan x="1845" y="39.0">External role  →  Process 0  →  External role response</tspan></text><rect x="1270" y="70" width="900" height="40" rx="7" fill="#ffffff" stroke="#cbd5e1"/><text x="1285" y="90" text-anchor="start" dominant-baseline="middle" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="400" fill="#334155"><tspan x="1285" y="90.0">Rectangle = external entity    Oval = Process 0    Arrow label = data crossing the system boundary</tspan></text><g id="ctx-super-in-connector"><path d="M 1040 310 L 1040 570 L 1020 570 L 1020 610" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><path d="M 1040 310 L 1040 570 L 1020 570 L 1020 610" fill="none" stroke="#334155" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ipawcus-context-arrow)"/></g><g id="ctx-super-out-connector"><path d="M 1180 610 L 1180 350 L 1160 350 L 1160 310" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><path d="M 1180 610 L 1180 350 L 1160 350 L 1160 310" fill="none" stroke="#334155" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ipawcus-context-arrow)"/>