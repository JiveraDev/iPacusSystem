oke-linecap="round" stroke-linejoin="round"/><path d="M 1180 910 L 1180 1240 L 1160 1240 L 1160 1280" fill="none" stroke="#334155" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ipawcus-context-arrow)"/></g><g id="ctx-system"><ellipse cx="1100" cy="760" rx="280" ry="150" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2.5"/><text x="1100" y="760" text-anchor="middle" dominant-baseline="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="#111827"><tspan x="1100" y="736.6">0</tspan><tspan x="1100" y="760.0">IPAWCUS</tspan><tspan x="1100" y="783.4">Integrated Pet Care and Clinic Management System</tspan></text></g><g id="ctx-super"><rect x="870" y="170" width="460" height="140" rx="5" fill="#ffffff" stroke="#374151" stroke-width="2.5"/><text x="1100" y="240" text-anchor="middle" dominant-baseline="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#111827"><tspan x="1100" y="230.9">SUPER ADMIN</tspan><tspan x="1100" y="249.1">Clinic Owner / System Overseer</tspan></text></g><g id="ctx-admin"><rect x="100" y="690" width="400" height="140" rx="5" fill="#ffffff" stroke="#374151" stroke-width="2.5"/><text x="300" y="760" text-anchor="middle" dominant-baseline="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#111827"><tspan x="300" y="750.9">ADMIN</tspan><tspan x="300" y="769.1">Nurse / Clinic Staff</tspan></text></g><g id="ctx-vet"><rect x="1700" y="690" width="400" height="140" rx="5" fill="#ffffff" stroke="#374151" stroke-width="2.5"/><text x="1900" y="760" text-anchor="middle" dominant-baseline="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#111827"><tspan x="1900" y="750.9">VETERINARIAN</tspan><tspan x="1900" y="769.1">Clinical Care Provider</tspan></text></g><g id="ctx-owner"><rect x="870" y="1280" width="460" height="140" rx="5" fill="#ffffff" stroke="#374151" stroke-width="2.5"/><text x="1100" y="1350" text-anchor="middle" dominant-baseline="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#111827"><tspan x="1100" y="1340.9">PET OWNER</tspan><tspan x="1100" y="1359.1">Client / Pet Parent</tspan></text></g><g id="ctx-super-in-label"><rect x="725.0" y="355.8" width="300" height="58" rx="5" fill="#ffffff" fill-opacity="0.97" stroke="#e2e8f0" stroke-width="1"/><text x="875.0" y="384.8" text-anchor="middle" dominant-baseline="middle" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="400" fill="#0f172a"><tspan x="875.0" y="377.7">Credentials; personnel, role, branch,</tspan><tspan x="875.0" y="392.0">payment-setting, report and recovery requests</tspan></text></g><g id="ctx-super-out-label"><rect x="1195.0" y="469.2" width="300" height="60" rx="5" fill="#ffffff" fill-opacity="0.97" stroke="#e2e8f0" stroke-width="1"/><text x="1345.0" y="499.2" text-anchor="middle" dominant-baseline="middle" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="400" fill="#0f172a"><tspan x="1345.0" y="484.9">Access, account and configuration status;</tspan><tspan x="1345.0" y="499.2">dashboards, audits, recovery results and</tspan><tspan x="1345.0" y="513.5">reports</tspan></text></g><g id="ctx-admin-in-label"><rect x="451.5" y="589.0" width="300" height="58" rx="5" fill="#ffffff" fill-opacity="0.97" stroke="#e2e8f0" stroke-width="1"/><text x="601.5" y="618.0" text-anchor="middle" dominant-baseline="middle" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="400" fill="#0f172a"><tspan x="601.5" y="610.9">Credentials; pet, booking, queue, boarding,</tspan><tspan x="601.5" y="625.1">inventory, billing and record-request actions</tspan></text></g><g id="ctx-admin-out-label"><rect x="568.5" y="941.0" width="300" height="58" rx="5" fill="#ffffff" fill-opacity="0.97" stroke="#e2e8f0" stroke-width="1"/><text x="718.5" y="970.0" text-anchor="middle" dominant-baseline="middle" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="400" fill="#0f172a"><tspan x="718.5" y="962.9">Access and branch permissions; pet, booking,</tspan><tspan x="718.5" y="977.1">visit, stock, billing and payment status</tspan></text></g><g id="ctx-vet-in-label"><rect x="1448.5" y="588.0" width="300" height="60" rx="5" fill="#ffffff" fill-opacity="0.97" stroke="#e2e8f0" stroke-width="1"/><text x="1598.5" y="618.0" text-anchor="middle" dominant-baseline="middle" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="400" fill="#0f172a"><tspan x="1598.5" y="603.7">Credentials; availability, assignment,</tspan><tspan x="1598.5" y="618.0">diagnosis,</tspan><tspan x="1598.5" y="632.3">treatment, record and task updates</tspan></text></g><g id="ctx-vet-out-label"><rect x="1331.5" y="933.0" width="300" height="74" rx="5" fill="#ffffff" fill-opacity="0.97" stroke="#e2e8f0" stroke-width="1"/><text x="1481.5" y="970.0" text-anchor="middle" dominant-baseline="middle" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="400" fill="#0f172a"><tspan x="1481.5" y="948.5">Access and branch assignment; schedules,</tspan><tspan x="1481.5" y="962.8">assigned</tspan><tspan x="1481.5" y="977.1">cases, pet history, consultation and</tspan><tspan x="1481.5" y="991.4">reminders</tspan></text></g><g id="ctx-owner-in-label"><rect x="685.0" y="1165.9" width="320" height="74" rx="5" fill="#ffffff" fill-opacity="0.97" stroke="#e2e8f0" stroke-width="1"/><text x="845.0" y="1202.9" text-anchor="middle" dominant-baseline="middle" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="400" fill="#0f172a"><tspan x="845.0" y="1181.5">Credentials, profile and notification</tspan><tspan x="845.0" y="1195.8">preferences;</tspan><tspan x="845.0" y="1210.0">pet, booking, consent, payment, queue and</tspan><tspan x="845.0" y="1224.4">consultation data</tspan></text></g><g id="ctx-owner-out-label"><rect x="1205.0" y="1057.1" width="300" height="60" rx="5" fill="#ffffff" fill-opacity="0.97" stroke="#e2e8f0" stroke-width="1"/><text x="1355.0" y="1087.1" text-anchor="middle" dominant-baseline="middle" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="400" fill="#0f172a"><tspan x="1355.0" y="1072.8">Access, pet, booking, payment and queue</tspan><tspan x="1355.0" y="1087.1">status;</tspan><tspan x="1355.0" y="1101.4">reminders, diagnoses and medical records</tspan></text></g>
