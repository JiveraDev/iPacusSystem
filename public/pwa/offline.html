<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#155dfc" />
    <title>iPawcus Offline</title>
    <style>
      :root {
        color: #0f172a;
        background: #f8fafc;
        font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
      }

      main {
        width: min(100%, 420px);
        border: 1px solid #e2e8f0;
        border-radius: 12px;
        background: #ffffff;
        box-shadow: 0 16px 40px rgb(15 23 42 / 10%);
        padding: 28px;
      }

      img {
        width: 64px;
        height: 64px;
        display: block;
      }

      h1 {
        margin: 20px 0 8px;
        font-size: 24px;
        line-height: 1.15;
      }

      p {
        margin: 0;
        color: #475569;
        font-size: 15px;
        line-height: 1.6;
      }

      button {
        margin-top: 22px;
        min-height: 42px;
        border: 0;
        border-radius: 8px;
        background: #155dfc;
        color: #ffffff;
        font: inherit;
        font-weight: 700;
        padding: 10px 16px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/pwa/icons/icon-192.png" alt="" />
      <h1>iPawcus is offline</h1>
      <p>The app shell is available, but live clinic records need a network connection before they can refresh.</p>
      <button type="button" onclick="window.location.reload()">Try Again</button>
    </main>
  </body>
</html>
